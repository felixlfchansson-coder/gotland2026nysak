<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Filosofi</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles/global.css">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;

      background-image: url("images/classrooms/jones_class.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      font-family: Georgia, serif;
    }

    /* TILLBAKA-KNAPP */

    .tillbaka-knapp {
      position: absolute;

      top: 20px;
      left: 20px;

      z-index: 10;
    }

    .tillbaka-knapp img {
      width: clamp(130px, 35vw, 200px);

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .tillbaka-knapp img:hover {
      transform: scale(1.08);
    }

    /* FAKTARUTA */

    .fakta-box {
      position: absolute;

      top: 72%;
      left: 50%;

      transform: translate(-65%, -110%);

      width: 92vw;
      max-width: 500px;

      aspect-ratio: 1 / 1;

      background-image: url("images/classrooms/skylt_arke.png");

      background-size: 60% 100%;
      background-repeat: no-repeat;
      background-position: center;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;

      animation: glow 3s infinite alternate;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 5;
    }

    .fakta-box:hover {
      transform: translate(-65%, -110%) scale(1.03);
    }

    .fakta-text {
      width: 40%;

      margin-top: 100px;

      font-family: 'Cinzel', serif;

      font-size: clamp(0.95rem, 3vw, 1.3rem);

      line-height: 1.5;

      color: #c8a96b;

      text-align: center;

      text-shadow:
        0 0 4px rgba(0,0,0,0.9),
        0 0 10px rgba(0,0,0,0.7);
    }

    /* GLOW */

    @keyframes glow {

      from {
        filter: drop-shadow(0 0 5px rgba(255,180,80,0.2));
      }

      to {
        filter: drop-shadow(0 0 20px rgba(255,180,80,0.6));
      }

    }

    /* DESKTOP */

    @media (min-width: 768px) {

      body {
        background-position: center;
      }

      .tillbaka-knapp {
        top: 30px;
        left: 30px;
      }

      .tillbaka-knapp img {
        width: 200px;
      }

      .fakta-box {
        top: 72%;
        left: 78%;

        width: 38vw;
        max-width: 560px;
      }

      .fakta-text {
        font-size: clamp(0.9rem, 1.3vw, 1.4rem);
      }

    }

  </style>

</head>

<body>

  <a href="fakta.html" class="tillbaka-knapp">
    <img
      src="images/classrooms/tillbaka.png"
      alt="Tillbaka"
    >
  </a>

  <div class="fakta-box" id="faktaKnapp">

    <p class="fakta-text" id="faktaText">
      Min lilla tänkare... tryck för att få en tanke.
    </p>

  </div>

  <script>

    let faktaData = [];

    fetch("fakta_structured.json")
      .then(response => response.json())
      .then(data => {

        faktaData = data.arkeologi.facts;

      });

    const faktaKnapp =
      document.getElementById("faktaKnapp");

    const faktaText =
      document.getElementById("faktaText");

    faktaKnapp.addEventListener("click", () => {

      const slumpTal =
        Math.floor(Math.random() * faktaData.length);

      faktaText.textContent =
        faktaData[slumpTal];

    });

  </script>
  <script type="module">
import { markPageVisited } from "scripts/cosmetics.js";

markPageVisited("arkeologi");
</script>

  <script src="scripts/profilebox.js"></script>
  <script src="scripts/auth-check.js"></script>

</body>
</html>
