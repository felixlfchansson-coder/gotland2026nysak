<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Filosofi</title>
<link rel="stylesheet" href="styles/global.css">
  <style>
 
   * {
  margin: 10;
  padding: 10;
  box-sizing: border-box;
}

body {
  width: 95%;
  min-height: 110vh;
  overflow: hidden;

  background-image: url("images/classrooms/snapes_class.png");
  background-size: cover;
  background-position: 42% center;
  background-repeat: no-repeat;

  font-family: Georgia, serif;
}

/* TILLBAKA-KNAPP */
.tillbaka-knapp {
  position: absolute;
  top: 10%;
  left: 10px;
  z-index: 10;
}

.tillbaka-knapp img {
  width: clamp(130px, 35vw, 200px);
  cursor: pointer;
  transition: transform 0.2s ease;
}

.tillbaka-knapp img:hover {
  transform: scale(1.08);
}

/* FAKTARUTA / SKYLT */
.fakta-box {
  position: absolute;

  top: 50%;
  left: 80%;

  transform: translate(-19%, -85%);

  width: 92vw;
  max-width: 500px;

  aspect-ratio: 1 / 1;

  background-image: url("images/classrooms/skylt_snape.png");
  background-size: 60% 90%;
  background-repeat: no-repeat;
  background-position: center;

  cursor: pointer;

  transition: transform 0.2s ease, filter 0.2s ease;

  animation: glow 3s infinite alternate;

  /* NYTT */
  display: flex;
  justify-content: center;
  align-items: center;

  position: absolute;
}


/* HOVER */
.fakta-box:hover {
  transform: translate(-19%, -85%) scale(1.03);
}

/* TITEL */
.fakta-titel {
  position: absolute;

  top: 18%;
  left: 50%;

  transform: translateX(-50%);

  width: 50%;

  font-family: Georgia, serif;

  font-size: clamp(1.3rem, 5vw, 2.2rem);

  font-weight: bold;

  color: #f1ddb0;

  text-align: center;

  letter-spacing: 1px;

  line-height: 1.1;

  text-shadow:
    0 0 4px rgba(0,0,0,0.9),
    0 0 12px rgba(0,0,0,0.7);
}

/* FAKTATEXT */
.fakta-text {
  width: 45%;

  font-family: Georgia, serif;
  font-size: clamp(0.8rem, 3.5vw, 1.2rem);

  line-height: 1.35;

  color: #f4d9a5;

  text-align: center;

  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}

/* GLOW */
@keyframes glow {
  from {
    filter: drop-shadow(0 0 5px rgba(255,180,80,0.2));
  }

  to {
    filter: drop-shadow(0 0 20px rgba(255,180,80,0.6));
  }
}

/* DESKTOP */
@media (min-width: 768px) {
  body {
    background-position: center;
  }

  .tillbaka-knapp {
    top: 30px;
    left: 30px;
  }

  .tillbaka-knapp img {
    width: 200px;
  }

  .fakta-box {
    top: 72%;
    left: 78%;

    width: 38vw;
    max-width: 560px;
  }

  .fakta-titel {
    font-size: clamp(1rem, 1.6vw, 1.6rem);
  }

  .fakta-text {
    font-size: clamp(0.9rem, 1.3vw, 1.4rem);
  }
}
  </style>
</head>
<a href="fakta.html" class="tillbaka-knapp">
  <img src="images/classrooms/tillbaka.png" alt="Tillbaka">
</a>
<body>

   <div class="fakta-box" id="faktaKnapp">
    <h1 class="fakta-titel">Avdelningen för Besvikelse</h1>

<p class="fakta-text" id="faktaText">
  Ingen motivation. Ingen glädje.<br>
  Bara sarkasm, dömande blickar och tveksamt användbar kunskap.
</p>
  </p>
</div>

</div>
</div>

</body>
<script src="scripts/profilebox.js"></script>

<script type="module">
import { markPageVisited, addCounter } from "./scripts/cosmetics.js";

markPageVisited("snape");

let faktaData = [];

fetch("fakta_structured.json")
  .then(response => response.json())
  .then(data => {
    faktaData = data.snape.facts;
  });

const faktaKnapp = document.getElementById("faktaKnapp");
const faktaText = document.getElementById("faktaText");

faktaKnapp.addEventListener("click", () => {
  addCounter("snapeButton");

  if (!faktaData.length) return;

  const slumpTal = Math.floor(Math.random() * faktaData.length);
  faktaText.textContent = faktaData[slumpTal];
});
</script>
<script src="scripts/profilebox.js"></script>
</html>
