<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gudstjänst</title>
  <link rel="stylesheet" href="styles/global.css">
  <style>
    * {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #1f140c;
  font-family: Georgia, "Times New Roman", serif;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  overflow-x: hidden;
  overflow-y: auto;
}

.gudstjanst {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100svh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 14px;
  padding: 18px;

  background:
    radial-gradient(circle at top, #5a3519 0%, #1f140c 65%);

  user-select: none;
}

.scen-knapp {
  all: unset;

  position: relative;

  width: min(92vw, 520px);
  max-height: 68svh;
  aspect-ratio: 9 / 16;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 26px;
  overflow: hidden;

  background: #000;

  box-shadow:
    0 25px 60px rgba(0, 0, 0, 0.65),
    0 0 0 5px rgba(255, 232, 177, 0.12);
}

.scen-bild {
  width: 100%;
  height: 100%;

  object-fit: contain;
  object-position: center;

  display: block;
}

.scen-knapp:hover .scen-bild {
  transform: scale(1.01);
}

.dialogruta {
  display: none;

  width: min(92vw, 520px);
  min-height: 110px;

  padding: 18px 20px;

  border-radius: 22px;

  background: rgba(255, 244, 214, 0.96);
  border: 4px solid rgba(90, 53, 25, 0.55);

  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

  color: #3b2111;

  font-size: clamp(1rem, 4.2vw, 1.4rem);
  line-height: 1.4;

  text-align: left;

  max-height: 5.2em;
  overflow: hidden;
}

.dialogruta.visa {
  display: block;
}

.dialogruta strong {
  color: #5a3519;
}

.dialogruta em {
  opacity: 0.85;
}

.kontroller {
  position: absolute;

  left: 12px;
  right: 12px;
  top: 12px;

  z-index: 10;

  display: flex;
  justify-content: space-between;
  gap: 10px;

  pointer-events: none;
}

.kontroll-knapp {
  pointer-events: auto;

  padding: 10px 14px;

  font-family: inherit;
  font-size: 1rem;
  font-weight: bold;

  color: #fff3c4;
  background: rgba(91, 53, 24, 0.9);

  border: 3px solid #c69a4c;
  border-radius: 999px;

  cursor: pointer;

  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}

.kontroll-knapp:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.steg-raknare {
  pointer-events: none;

  align-self: center;

  padding: 8px 12px;

  color: #fff3c4;
  background: rgba(31, 20, 12, 0.65);

  border-radius: 999px;

  font-size: 0.95rem;

  text-shadow: 0 1px 2px #000;
}

@media (min-width: 700px) {
  .gudstjanst {
    padding: 28px;
    gap: 18px;
  }

  .scen-knapp {
    width: min(84vw, 1100px);
    height: min(72svh, 900px);
    aspect-ratio: auto;

    border-radius: 34px;
  }

  .dialogruta {
    width: min(72vw, 760px);

    min-height: 150px;

    padding: 28px 36px;

    font-size: clamp(1.1rem, 1.8vw, 1.5rem);
  }

  .kontroller {
    left: 24px;
    right: 24px;
    top: 24px;
  }

  .kontroll-knapp {
    font-size: 1.1rem;
    padding: 12px 20px;
  }
}
  </style>
</head>
<body>

    </div>

      <div id="stegRakare" class="steg-raknare">1 / 1</div>

      <div style="display:flex; gap:10px; pointer-events:auto;">
        <button class="kontroll-knapp" onclick="startaOm(event)">Börja om</button>

        <button class="kontroll-knapp" onclick="gaUt(event)">
          Gå ut ⛪

    </div>

    const stegRakare = document.getElementById("stegRakare");

    function visaSteg() {
      const stegData = steg[aktivtSteg];

      scenBild.src = stegData.bild;

      if (stegData.bubbla) {
        dialogruta.innerHTML = stegData.bubbla;
        dialogruta.classList.add("visa");
      } else {
        dialogruta.innerHTML = "";
        dialogruta.classList.remove("visa");
      }

      if (stegData.ljud) {
        scenLjud.pause();
        scenLjud.currentTime = 0;
        scenLjud.src = stegData.ljud;
        scenLjud.play().catch(() => {
          // Mobilwebbläsare kan ibland vänta med ljud tills användaren trycker.
        });
      }

      backaKnapp.disabled = aktivtSteg === 0;
      stegRakare.textContent = `${aktivtSteg + 1} / ${steg.length}`;
    }

    function nastaSteg() {
      if (aktivtSteg < steg.length - 1) {
        aktivtSteg++;
        visaSteg();
      }
    }

    function backaSteg(event) {
      event.stopPropagation();

      if (aktivtSteg > 0) {
        aktivtSteg--;
        visaSteg();
      }
    }

    function startaOm(event) {
      event.stopPropagation();
      aktivtSteg = 0;
      visaSteg();
    }

    function gaUt(event) {
      event.stopPropagation();
      window.location.href = "kyrkan.html";
    }

    visaSteg();
